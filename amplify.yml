version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Node version comes from .nvmrc (the project needs Node 22.17+).
        - nvm install
        - nvm use
        - node -v
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Builds from the committed snapshot; feeds are not re-fetched here.
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
