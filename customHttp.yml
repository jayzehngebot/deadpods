# Response headers for Amplify Hosting. This file overrides any custom headers
# set in the Amplify console. Changes apply on the next deploy.
# The page-level Content-Security-Policy is generated by SvelteKit (see
# vite.config.ts); the one here only adds rules a <meta> tag can't carry.
customHeaders:
  - pattern: '**'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=63072000; includeSubDomains'
      - key: 'Content-Security-Policy'
        value: "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Permissions-Policy'
        value: 'camera=(), microphone=(), geolocation=(), payment=(), usb=()'
      - key: 'Cross-Origin-Opener-Policy'
        value: 'same-origin'
  # Hashed filenames never change, so browsers can cache them for a year.
  - pattern: '/_app/immutable/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
